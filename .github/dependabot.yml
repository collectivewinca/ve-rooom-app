version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "wrangler"
      react:
        patterns:
          - "react*"
          - "@types/react*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
